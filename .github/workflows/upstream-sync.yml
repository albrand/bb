name: Upstream sync

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ours

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Fetch upstream
        id: upstream
        run: |
          git remote add upstream https://github.com/get-bb/bb.git 2>/dev/null || true
          git fetch --no-tags upstream main
          git fetch --no-tags origin \
            refs/heads/automation/upstream-main:refs/remotes/origin/automation/upstream-main \
            2>/dev/null || true
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"

      - name: Integrate upstream on a dedicated branch
        if: steps.upstream.outputs.needs_sync == 'true'
        run: |
          git config user.name "bb upstream sync"
          git config user.email "bb-upstream-sync@users.noreply.github.com"
          git switch -C automation/upstream-main
          # Fork-owned behavior is authoritative.  Keep our side only for
          # conflicting hunks; retain every non-conflicting upstream change so
          # this scheduled integration cannot leave ours behind.
          git merge --no-ff --no-commit -X ours upstream/main
          # GitHub's workflow token cannot publish changes to workflow files.
          # These fork-owned control-plane files are authoritative anyway, so
          # retain existing fork workflows and drop upstream-only additions.
          workflow_paths="$(git diff --name-only HEAD upstream/main -- .github/workflows)"
          if [ -n "$workflow_paths" ]; then
            while IFS= read -r path; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git restore --source=HEAD --staged --worktree -- "$path"
              else
                git rm -f -- "$path"
              fi
            done <<< "$workflow_paths"
          fi
          git commit -m "chore: integrate upstream main"
          git push --force-with-lease origin HEAD:automation/upstream-main

      - name: Open or update the integration pull request
        if: steps.upstream.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr create \
            --base ours \
            --head automation/upstream-main \
            --title "chore: integrate upstream main" \
            --body "Automated upstream integration, ready for fork-quality review."; then
            if ! gh pr edit automation/upstream-main \
              --title "chore: integrate upstream main" \
              --body "Automated upstream integration, ready for fork-quality review."; then
              echo "::warning::Integration branch published, but this repository policy does not permit the workflow token to create or edit pull requests."
            fi
          fi

      - name: Validate the integration branch
        if: steps.upstream.outputs.needs_sync == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
