name: Upstream sync

on:
  schedule:
    # Poll hourly so upstream changes do not sit behind a once-daily window.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  # A scheduled run and a manual retry must never rebuild/push the same
  # integration branch concurrently.
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ours

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Fetch upstream
        id: upstream
        run: |
          git remote add upstream https://github.com/get-bb/bb.git 2>/dev/null || true
          git fetch --no-tags upstream main
          git fetch --no-tags origin \
            refs/heads/automation/upstream-main:refs/remotes/origin/automation/upstream-main \
            2>/dev/null || true
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"

      - name: Integrate upstream on a dedicated branch
        if: steps.upstream.outputs.needs_sync == 'true'
        run: |
          git config user.name "bb upstream sync"
          git config user.email "bb-upstream-sync@users.noreply.github.com"
          git switch -C automation/upstream-main
          # Fork-owned behavior is authoritative. Retain every non-conflicting
          # upstream file, but resolve a conflicting file as a whole from our
          # side; hunk-level auto-resolution can create invalid hybrids (for
          # example, mismatched JSX tags across adjacent conflict hunks).
          if ! git merge --no-ff --no-commit upstream/main; then
            conflicted_paths="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicted_paths" ]; then
              echo "Upstream merge failed without a resolvable conflict list." >&2
              exit 1
            fi
            while IFS= read -r conflict_path; do
              if git cat-file -e "HEAD:$conflict_path" 2>/dev/null; then
                git checkout --ours -- "$conflict_path"
                git add -- "$conflict_path"
              else
                git rm -f -- "$conflict_path"
              fi
            done <<< "$conflicted_paths"
          fi
          # GitHub's workflow token cannot publish changes to workflow files.
          # These fork-owned control-plane files are authoritative anyway, so
          # retain existing fork workflows and drop upstream-only additions.
          workflow_paths="$(git diff --name-only HEAD upstream/main -- .github/workflows)"
          if [ -n "$workflow_paths" ]; then
            while IFS= read -r path; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git restore --source=HEAD --staged --worktree -- "$path"
              else
                git rm -f -- "$path"
              fi
            done <<< "$workflow_paths"
          fi
          git commit -m "chore: integrate upstream main"

      - name: Validate the integration branch
        if: steps.upstream.outputs.needs_sync == 'true'
        run: |
          # Fork-owned conflict resolution can retain an older lockfile while
          # upstream adds a dependency to a non-conflicting workspace manifest.
          # Reconcile that deterministic metadata before the typecheck instead
          # of failing every sync on ERR_PNPM_OUTDATED_LOCKFILE.
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git add pnpm-lock.yaml
            git commit -m "chore: refresh integration lockfile"
          fi

      - name: Publish validated integration branch
        if: steps.upstream.outputs.needs_sync == 'true'
        run: git push --force-with-lease origin HEAD:automation/upstream-main

      - name: Open or update the integration pull request
        if: steps.upstream.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=ours&head=${GITHUB_REPOSITORY_OWNER}:automation%2Fupstream-main" \
            --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Integration pull request #$existing_pr already exists; branch was updated."
          elif ! gh pr create \
            --base ours \
            --head automation/upstream-main \
            --title "chore: integrate upstream main" \
            --body "Automated upstream integration, ready for fork-quality review."; then
            echo "::warning::Integration branch published, but this repository policy does not permit the workflow token to create the pull request."
          fi
