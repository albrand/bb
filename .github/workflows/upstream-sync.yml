name: Upstream sync

on:
  schedule:
    # Poll hourly so upstream changes do not sit behind a once-daily window.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  # A scheduled run and a manual retry must never merge/push ours concurrently.
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ours

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Fetch upstream
        id: upstream
        run: |
          git remote add upstream https://github.com/get-bb/bb.git 2>/dev/null || true
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork already contains upstream/main."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "needs_sync=true" >> "$GITHUB_OUTPUT"

      - name: Integrate upstream directly on ours
        if: steps.upstream.outputs.needs_sync == 'true'
        run: |
          git config user.name "bb upstream sync"
          git config user.email "bb-upstream-sync@users.noreply.github.com"
          # Fork-owned behavior is authoritative. Retain every non-conflicting
          # upstream file. Semantic conflicts are not safe to resolve in CI:
          # choosing either side can drop fork reliability behavior or create an
          # invalid API hybrid. Leave ours untouched and publish the exact
          # conflict manifest for explicit reconciliation.
          if ! git merge --no-ff --no-commit upstream/main; then
            conflicted_paths="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicted_paths" ]; then
              echo "Upstream merge failed without a resolvable conflict list." >&2
              exit 1
            fi
            {
              echo "### Upstream integration requires explicit reconciliation"
              echo
              echo "The fork was not published or changed. Conflicted paths:"
              while IFS= read -r conflict_path; do
                printf -- '- %s\n' "$conflict_path"
              done <<< "$conflicted_paths"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$conflicted_paths" >&2
            exit 1
          fi
          # GitHub's workflow token cannot publish changes to workflow files.
          # These fork-owned control-plane files are authoritative anyway, so
          # retain existing fork workflows and drop upstream-only additions.
          workflow_paths="$(git diff --name-only HEAD upstream/main -- .github/workflows)"
          if [ -n "$workflow_paths" ]; then
            while IFS= read -r path; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git restore --source=HEAD --staged --worktree -- "$path"
              else
                git rm -f -- "$path"
              fi
            done <<< "$workflow_paths"
          fi
          git commit -m "chore: integrate upstream main"

      - name: Validate the direct merge
        if: steps.upstream.outputs.needs_sync == 'true'
        run: |
          # Fork-owned conflict resolution can retain an older lockfile while
          # upstream adds a dependency to a non-conflicting workspace manifest.
          # Reconcile that deterministic metadata before the typecheck instead
          # of failing every sync on ERR_PNPM_OUTDATED_LOCKFILE.
          pnpm install --no-frozen-lockfile
          pnpm typecheck
          unexpected="$(git status --porcelain | awk "\$2 != \"pnpm-lock.yaml\" {print}")"
          if [ -n "$unexpected" ]; then
            echo "Validation generated unexpected tracked changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git add pnpm-lock.yaml
            git commit -m "chore: refresh integration lockfile"
          fi

      - name: Publish validated merge directly to ours
        if: steps.upstream.outputs.needs_sync == 'true'
        run: git push origin HEAD:ours
